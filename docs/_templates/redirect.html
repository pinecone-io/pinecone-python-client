<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>This page has moved</title>
<link rel="canonical" href="${to_uri}">
<meta http-equiv="refresh" content="0; url=${to_uri}">
<script>
(function () {
  var target = "${to_uri}";
  var hash = window.location.hash;
  // A stub sits at whatever depth its old URL had, so its target carries a
  // matching "../" prefix. Any page substituted below has to carry the same
  // one. Stubs that forward somewhere other than reference/ never rewrite a
  // fragment, because only the reference pages carry autodoc anchors.
  var into = target.match(/^((?:\.\.\/)*)reference\//);
  var prefix = into ? into[1] : "";
  // Classes that were renamed or moved to a different page in 10.0. Each row is
  // the old autodoc id, the reference/ page the class now lives on, and its new
  // id. A hash is either the class id itself or that id followed by ".<member>",
  // and the member name is kept. Old ids are unique across the old pages, so
  // one table serves every stub that forwards into reference/.
  var classes = [
    ["pinecone.db_data.Index", "sync-index.html", "pinecone.index.Index"],
    ["pinecone.db_data.IndexAsyncio", "async-index.html", "pinecone.async_client.async_index.AsyncIndex"],
    ["pinecone.inference.Inference", "pinecone.html", "pinecone.client.inference.Inference"],
    ["pinecone.inference.AsyncioInference", "async-pinecone.html", "pinecone.async_client.inference.AsyncInference"],
    ["pinecone.PineconeAsyncio", "async-pinecone.html", "pinecone.async_client.pinecone.AsyncPinecone"],
    ["pinecone.grpc.PineconeGRPC", "pinecone.html", "pinecone.Pinecone"],
    ["pinecone.grpc.GRPCIndex", "grpc.html", "pinecone.grpc.GrpcIndex"],
    ["pinecone.Admin", "admin.html", "pinecone.admin.Admin"],
    ["pinecone.admin.resources.ApiKeyResource", "admin.html", "pinecone.admin.api_keys.ApiKeys"],
    ["pinecone.admin.resources.OrganizationResource", "admin.html", "pinecone.admin.organizations.Organizations"],
    ["pinecone.admin.resources.ProjectResource", "admin.html", "pinecone.admin.projects.Projects"]
  ];
  // 10.0 moved the control-plane verbs off the client classes onto sub-resource
  // objects, so a rename of the owning class is not enough to place them: the
  // member name changed too. The split is identical for the sync, asyncio and
  // gRPC clients, so one map serves all three and only the module and the class
  // prefix differ. Verbs absent here stayed on the client and need no rewrite.
  var verbs = {
    "create_index": ["indexes", "create"],
    "delete_index": ["indexes", "delete"],
    "describe_index": ["indexes", "describe"],
    "list_indexes": ["indexes", "list"],
    "configure_index": ["indexes", "configure"],
    "has_index": ["indexes", "exists"],
    "create_index_for_model": ["indexes", "create_for_model"],
    "create_backup": ["indexes", "create_backup"],
    "describe_backup": ["indexes", "describe_backup"],
    "list_backups": ["indexes", "list_backups"],
    "delete_backup": ["backups", "delete"],
    "create_collection": ["collections", "create"],
    "delete_collection": ["collections", "delete"],
    "describe_collection": ["collections", "describe"],
    "list_collections": ["collections", "list"],
    "describe_restore_job": ["restore_jobs", "describe"],
    "list_restore_jobs": ["restore_jobs", "list"]
  };
  var resources = {
    "indexes": "Indexes",
    "collections": "Collections",
    "backups": "Backups",
    "restore_jobs": "RestoreJobs"
  };
  // Old client class, the page it now lives on, its module, and the prefix its
  // sub-resource class names take.
  var clients = [
    ["pinecone.Pinecone", "pinecone.html", "pinecone.client", ""],
    ["pinecone.PineconeAsyncio", "async-pinecone.html", "pinecone.async_client", "Async"],
    ["pinecone.grpc.PineconeGRPC", "pinecone.html", "pinecone.client", ""]
  ];
  // Section anchors, which autodoc ids cannot cover: a heading that was renamed,
  // or one whose content became a page of its own. A value may carry its own
  // fragment; without one the reader lands at the top of the named page.
  var sections = {
    "rest.html#db-control-plane": "pinecone.html",
    "rest.html#db-data-plane": "sync-index.html",
    "rest.html#vectors": "sync-index.html",
    "rest.html#records": "sync-index.html",
    "rest.html#namespaces": "sync-index.html",
    "rest.html#bulk-import": "sync-index.html",
    "rest.html#restore-jobs": "pinecone.html#restorejobs",
    "asyncio.html#db-control-plane": "async-pinecone.html",
    "asyncio.html#db-data-plane": "async-index.html",
    "asyncio.html#vectors": "async-index.html",
    "asyncio.html#records": "async-index.html",
    "asyncio.html#namespaces": "async-index.html",
    "asyncio.html#bulk-import": "async-index.html",
    "asyncio.html#pineconeasyncio": "async-pinecone.html#asyncpinecone",
    "asyncio.html#indexes": "async-pinecone.html#asyncindexes",
    "asyncio.html#collections": "async-pinecone.html#asynccollections",
    "asyncio.html#backups": "async-pinecone.html#asyncbackups",
    "asyncio.html#inference": "async-pinecone.html#asyncinference",
    "asyncio.html#restore-jobs": "async-pinecone.html#asyncrestorejobs",
    // 10.0 folded PineconeGRPC into Pinecone, so the gRPC page documents only
    // the index and future classes. Its control-plane anchors belong elsewhere.
    "grpc.html#pineconegrpc": "pinecone.html",
    "grpc.html#db-control-plane": "pinecone.html",
    "grpc.html#indexes": "pinecone.html",
    "grpc.html#collections": "pinecone.html",
    "grpc.html#backups": "pinecone.html",
    "grpc.html#restore-jobs": "pinecone.html#restorejobs",
    "grpc.html#db-data-plane": "grpc.html",
    "grpc.html#vectors": "grpc.html",
    "grpc.html#namespaces": "grpc.html",
    "admin.html#admin-api": "admin.html#admin"
  };
  var page = window.location.pathname.split("/").pop();
  var moved = sections[page + hash];
  if (target.indexOf("#") !== -1) {
    // The target names its own section; the old fragment has nothing to add.
    hash = "";
  } else if (moved) {
    target = prefix + "reference/" + moved;
    hash = "";
  } else if (hash && into) {
    var id = hash.substring(1);
    var done = false;
    // A relocated member is more specific than its class's rename, so it wins.
    for (var c = 0; c < clients.length && !done; c++) {
      if (id.indexOf(clients[c][0] + ".") === 0) {
        var verb = verbs[id.substring(clients[c][0].length + 1)];
        if (verb) {
          target = prefix + "reference/" + clients[c][1];
          hash = "#" + clients[c][2] + "." + verb[0] + "." +
                 clients[c][3] + resources[verb[0]] + "." + verb[1];
          done = true;
        }
      }
    }
    for (var i = 0; i < classes.length && !done; i++) {
      var oldId = classes[i][0];
      if (id === oldId || id.indexOf(oldId + ".") === 0) {
        target = prefix + "reference/" + classes[i][1];
        hash = "#" + classes[i][2] + id.substring(oldId.length);
        done = true;
      }
    }
  }
  window.location.replace(target + hash);
})();
</script>
</head>
<body>
<p>This page has moved to <a href="${to_uri}">${to_uri}</a>.</p>
</body>
</html>
